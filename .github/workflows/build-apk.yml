# .github/workflows/build-apk.yml
name: Build Android APK

run-name: "Build ${{ inputs.build_id }} - ${{ inputs.app_name }}"

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: '构建ID(后端生成,唯一)'
        required: true
        type: string
      app_name:
        description: '应用名称'
        required: true
        type: string
      package_name:
        description: '包名(如 com.example.app)'
        required: false
        default: ''
        type: string
      default_key:
        description: '推送默认 Key'
        required: true
        type: string
      server_url:
        description: 'HTTP 服务器地址'
        required: true
        type: string
      ws_url:
        description: 'WebSocket 地址'
        required: true
        type: string
      icon_base64:
        description: '图标 base64(可选,不含 data: 前缀)'
        required: false
        default: ''
        type: string
      version_name:
        description: '版本号(如 1.0.0)'
        required: false
        default: '1.0.0'
        type: string
      version_code:
        description: '版本码(整数,如 1)'
        required: false
        default: '1'
        type: string

env:
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '34'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Make scripts executable
        run: |
          chmod +x gradlew build/build_apk.sh build/inject_config.sh

      - name: Configure signing (Secrets or auto-generate)
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          mkdir -p build/keystore
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "🔐 使用 Release Keystore 签名(来自 GitHub Secrets)"
            echo "$KEYSTORE_BASE64" | base64 -d > build/keystore/release.keystore
            {
              echo "STORE_FILE=$GITHUB_WORKSPACE/build/keystore/release.keystore"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } > build/keystore/keystore.properties
            chmod 600 build/keystore/keystore.properties build/keystore/release.keystore
          else
            echo "📝 未配置 Release Keystore,自动生成临时签名..."
            AUTO_PASSWORD="pushapp_ci_$(date +%Y%m%d)"
            keytool -genkeypair \
              -v \
              -keystore build/keystore/release.keystore \
              -storetype JKS \
              -storepass "$AUTO_PASSWORD" \
              -alias "pushapp_release" \
              -keypass "$AUTO_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=PushApp, OU=CI-Auto, O=PushApp, L=CI, ST=CI, C=US" \
              2>&1 | tail -5
            {
              echo "STORE_FILE=$GITHUB_WORKSPACE/build/keystore/release.keystore"
              echo "KEY_ALIAS=pushapp_release"
              echo "STORE_PASSWORD=$AUTO_PASSWORD"
              echo "KEY_PASSWORD=$AUTO_PASSWORD"
            } > build/keystore/keystore.properties
            chmod 600 build/keystore/keystore.properties build/keystore/release.keystore
            echo ""
            echo "⚠️  签名已自动生成(仅用于测试,每次不同签名!)"
            echo "   正式发布请配置 APK_KEYSTORE_BASE64 / APK_KEYSTORE_PASSWORD / APK_KEY_ALIAS / APK_KEY_PASSWORD"
          fi

      - name: Decode icon (if provided)
        if: ${{ github.event.inputs.icon_base64 != '' }}
        env:
          ICON_BASE64: ${{ github.event.inputs.icon_base64 }}
        run: |
          mkdir -p /tmp/build-icon
          printf '%s' "$ICON_BASE64" | base64 -d > /tmp/build-icon/icon.png
          echo "图标已解码: $(file /tmp/build-icon/icon.png)"

      - name: Run build script
        env:
          BUILD_ID: ${{ github.event.inputs.build_id }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          DEFAULT_KEY: ${{ github.event.inputs.default_key }}
          SERVER_URL: ${{ github.event.inputs.server_url }}
          WS_URL: ${{ github.event.inputs.ws_url }}
          ICON_PATH: ${{ github.event.inputs.icon_base64 != '' && '/tmp/build-icon/icon.png' || '' }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          bash build/build_apk.sh \
            --build-id "$BUILD_ID" \
            --app-name "$APP_NAME" \
            --default-key "$DEFAULT_KEY" \
            --server-url "$SERVER_URL" \
            --ws-url "$WS_URL" \
            --package-name "$PACKAGE_NAME" \
            --icon-path "$ICON_PATH" \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --build-type release

      - name: Read build result
        id: result
        if: always()
        run: |
          RESULT_FILE="build/output/${{ github.event.inputs.build_id }}/result.json"
          if [ -f "$RESULT_FILE" ]; then
            STATUS=$(jq -r '.status // "failed"' "$RESULT_FILE")
            MESSAGE=$(jq -r '.message // "构建失败"' "$RESULT_FILE")
            APK_PATH=$(jq -r '.apk_path // ""' "$RESULT_FILE")
            echo "status=$STATUS" >> $GITHUB_OUTPUT
            echo "message=$MESSAGE" >> $GITHUB_OUTPUT
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "result.json: STATUS=$STATUS APK=$APK_PATH"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "message=构建未产出 result.json" >> $GITHUB_OUTPUT
            echo "apk_path=" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK to server via SCP
        if: success() && steps.result.outputs.status == 'success'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "build/output/${{ github.event.inputs.build_id }}/app-release.apk"
          target: "${{ secrets.SERVER_PROJECT_PATH }}/build/output/${{ github.event.inputs.build_id }}/"
          strip_components: 3

      - name: Upload build log to server via SCP
        if: ${{ always() && hashFiles(format('build/logs/{0}.log', github.event.inputs.build_id)) != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "build/logs/${{ github.event.inputs.build_id }}.log"
          target: "${{ secrets.SERVER_PROJECT_PATH }}/build/logs/"
          strip_components: 2

      - name: Update build status via SSH
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            STATUS="${{ steps.result.outputs.status }}"
            MESSAGE="${{ steps.result.outputs.message }}"
            APK_PATH="${{ secrets.SERVER_PROJECT_PATH }}/build/output/${{ github.event.inputs.build_id }}/app-release.apk"
            if [ -z "$STATUS" ]; then
              STATUS="failed"
              MESSAGE="workflow 异常终止(可能被取消或 runner 失败)"
            fi
            php ${{ secrets.SERVER_PROJECT_PATH }}/backend/bin/update_build_status.php \
              --build-id "${{ github.event.inputs.build_id }}" \
              --status "$STATUS" \
              --message "$MESSAGE" \
              --apk-path "$APK_PATH"
