name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'tmp/**'
      - 'build/output/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tmp/**'
      - 'build/output/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP Lint (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Composer install (no dev, no script)
        working-directory: backend
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts 2>&1 | tail -20

      - name: Lint all PHP files
        working-directory: backend
        run: |
          find src -name '*.php' -print0 | xargs -0 -n 1 php -l | grep -v "No syntax errors" | { grep . && exit 1 || echo "✅ All PHP files pass lint"; }

  admin-build:
    name: Admin Build (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci --prefer-offline 2>&1 | tail -5

      - name: Build
        working-directory: admin
        run: npm run build 2>&1 | tail -15

  user-build:
    name: User Build (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: user/package-lock.json

      - name: Install dependencies
        working-directory: user
        run: npm ci --prefer-offline 2>&1 | tail -5

      - name: Build
        working-directory: user
        run: npm run build 2>&1 | tail -15
