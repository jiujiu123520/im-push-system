<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4a90d9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d4e7d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="推送">
  <title>推送接收</title>
  <link rel="manifest" href="/webpush/manifest.webmanifest">
  <link rel="icon" href="/webpush/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/webpush/icon.svg">
  <style>
    :root {
      /* 浅色主题 */
      --bg: #f2f3f7;
      --card: #ffffff;
      --msg-bg: #f8f9fb;
      --input-bg: #fafafa;
      --input-bg-focus: #ffffff;
      --ghost-bg: #eef1f6;
      --primary: #4a90d9;
      --primary-dark: #357abd;
      /* 按钮底色与 --primary 分开：按钮上是白字，必须满足 4.5:1 对比度 */
      --primary-btn: #357abd;
      --danger: #c8432f;
      --text: #1c1c1e;
      --text-sub: #6b7280;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --tip-bg: #fff7e6;
      --tip-text: #8a6d1a;
      --tip-border: #f0d79a;
      --shadow: 0 1px 3px rgba(0, 0, 0, .06);
      --app-bar-bg: linear-gradient(180deg, #4a90d9 0%, #357abd 100%);
      --app-bar-border: transparent;
      --highlight: rgba(74, 144, 217, .18);
      color-scheme: light;

      /* 安全区：iPhone 14 Pro 及以后的「灵动岛」机型 safe-area-inset-top 约 59px，
         带刘海机型约 47px，普通机型 0。旧系统不支持 env() 时回退到合理值。 */
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    /* 深色主题：所有前景/背景色成对覆盖，逐项做过对比度校验（正文 ≥ 7:1，次要文字 ≥ 4.5:1），
       避免出现「深底深字」或「浅底浅字」这类看不清的冲突。 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --msg-bg: #2c2c2e;
        --input-bg: #2c2c2e;
        --input-bg-focus: #3a3a3c;
        --ghost-bg: #2c2c2e;
        --primary: #4a9eff;        /* 用于链接/强调文字：对 #1c1c1e 约 6.2:1 */
        --primary-dark: #3d8ae0;
        --primary-btn: #0a6ed1;    /* 白字按钮底色：对白字约 5.0:1 */
        --danger: #c8432f;         /* 白字按钮底色：对白字约 4.9:1 */
        --text: #f2f2f7;           /* 正文：对 #1c1c1e 约 16:1 */
        --text-sub: #a1a1aa;       /* 次要文字：对 #1c1c1e 约 7.4:1 */
        --text-muted: #a0a0a8;     /* 时间戳：对 #2c2c2e 约 5.4:1 */
        --border: #3a3a3c;
        --tip-bg: #33280d;
        --tip-text: #f0d79a;
        --tip-border: #5c4a1a;
        --shadow: none;
        --app-bar-bg: linear-gradient(180deg, #1d4e7d 0%, #16395c 100%);
        --app-bar-border: #000000;
        --highlight: rgba(74, 158, 255, .22);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      /* dvh 让高度跟随 Safari 地址栏/底部工具条的收放，避免页面被裁切 */
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    /* 顶栏：背景延伸到状态栏/灵动岛下方，并用 safe-area-inset-top 把标题让开。
       深色底同时解决 black-translucent 下白色状态栏图标落在浅色页面看不清的问题。 */
    .app-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--app-bar-bg);
      border-bottom: 1px solid var(--app-bar-border);
      padding: calc(var(--safe-top) + 10px) max(16px, var(--safe-right)) 14px max(16px, var(--safe-left));
    }
    .app-bar-inner { max-width: 560px; margin: 0 auto; }
    .app-bar h1 { color: #fff; font-size: 20px; margin: 0; text-align: center; }
    .app-bar .subtitle { color: rgba(255, 255, 255, .8); font-size: 12px; margin: 4px 0 0; text-align: center; }
    /* 内容区：左右避让横屏时的灵动岛/圆角，底部避让 Home Indicator */
    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px max(16px, var(--safe-right)) calc(16px + var(--safe-bottom)) max(16px, var(--safe-left));
    }
    .tip {
      background: var(--tip-bg); color: var(--tip-text); border: 1px solid var(--tip-border);
      border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.5; margin-bottom: 12px;
    }
    .card {
      background: var(--card); border-radius: 14px; padding: 16px;
      box-shadow: var(--shadow); margin-bottom: 12px;
    }
    .device-id { font-size: 12px; color: var(--text-sub); word-break: break-all; margin-bottom: 12px; text-align: center; }
    label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
    input[type="text"], input[type="search"] {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 15px; outline: none; background: var(--input-bg); color: var(--text);
      -webkit-appearance: none; appearance: none;
    }
    input[type="text"]:focus, input[type="search"]:focus { border-color: var(--primary); background: var(--input-bg-focus); }
    input::placeholder { color: var(--text-sub); opacity: 1; }
    button {
      border: none; border-radius: 10px; padding: 13px 16px; font-size: 15px;
      cursor: pointer; transition: opacity .15s; width: 100%;
    }
    button:active { opacity: .7; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--primary-btn); color: #fff; }
    .btn-ghost { background: var(--ghost-bg); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-row { display: flex; gap: 10px; }
    .btn-row button { flex: 1; }
    .mt { margin-top: 10px; }
    .status { font-size: 13px; color: var(--text-sub); text-align: center; margin: 10px 0; min-height: 18px; word-break: break-all; }
    .section-title { font-size: 15px; font-weight: 600; margin: 0; color: var(--text); }

    .msg-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .link-btn {
      width: auto; background: none; border: none; padding: 4px 6px;
      color: var(--primary); font-size: 14px; line-height: 1.2;
    }
    .link-btn:active { opacity: .6; }
    .search-wrap { margin-bottom: 10px; }
    #search-input { padding: 10px 12px; font-size: 14px; }

    .message-list { display: flex; flex-direction: column; gap: 10px; }
    .message-item {
      background: var(--msg-bg); border-radius: 10px; padding: 12px;
      border-left: 3px solid var(--primary); transition: background .3s;
    }
    .message-item.highlight { background: var(--highlight); }
    .message-head { display: flex; align-items: flex-start; gap: 8px; }
    .message-title { flex: 1; font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--text); word-break: break-word; }
    .message-del {
      flex: none; width: 26px; height: 26px; padding: 0; border-radius: 50%;
      background: none; color: var(--text-sub); font-size: 18px; line-height: 1;
    }
    .message-del:active { opacity: .5; }
    .message-content { font-size: 13px; color: var(--text); word-break: break-word; white-space: pre-wrap; line-height: 1.45; }
    /* 长文折叠：超过 3 行截断，点「展开」看全文 */
    .message-content.clamped {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .message-toggle { margin-top: 2px; padding: 2px 0; font-size: 13px; }
    .message-time { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    .empty { text-align: center; color: var(--text-sub); font-size: 13px; padding: 24px 0; }
    .list-footer { margin-top: 12px; text-align: center; }
    .list-footer button { width: auto; padding: 9px 22px; font-size: 14px; }
    .foot-text { font-size: 12px; color: var(--text-sub); }
    .sentinel { height: 1px; }
  </style>
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-inner">
      <h1>推送接收</h1>
      <p class="subtitle">PWA · Web Push</p>
    </div>
  </header>

  <div class="container">
    <div id="ios-tip" class="tip" style="display:none">
      检测到 iOS 设备：请先通过 Safari 分享菜单选择「添加到主屏幕」，再从主屏幕图标打开本页，即可启用推送通知。
    </div>
    <div id="sub-warn" class="tip" style="display:none"></div>

    <div class="device-id">设备ID：<span id="device-id"></span></div>

    <div class="card">
      <label for="key-input">推送 Key</label>
      <input id="key-input" type="text" placeholder="输入推送 Key" autocomplete="off">
      <button id="save-key-btn" class="btn-ghost mt">保存 Key</button>
    </div>

    <div class="card">
      <button id="subscribe-btn" class="btn-primary">启用推送</button>
      <div class="btn-row mt">
        <button id="test-btn" class="btn-ghost" disabled>测试推送</button>
        <button id="refresh-btn" class="btn-ghost">刷新消息</button>
      </div>
      <div id="status" class="status"></div>
    </div>

    <div class="card">
      <div class="msg-header">
        <div class="section-title">消息列表</div>
        <button id="clear-btn" class="link-btn">清空</button>
      </div>
      <div class="search-wrap">
        <input id="search-input" type="text" inputmode="search" enterkeyhint="search"
               placeholder="搜索标题或内容" autocomplete="off">
      </div>
      <div id="message-list" class="message-list"><div class="empty">暂无消息</div></div>
      <div id="list-footer" class="list-footer"></div>
      <div id="load-sentinel" class="sentinel"></div>
    </div>
  </div>
  <script src="/webpush/shared.js"></script>
  <script src="/webpush/app.js"></script>
</body>
</html>
